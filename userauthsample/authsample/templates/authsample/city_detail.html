{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block main %}
<div>
    <h2><a href="{% url 'city_edit' city.uuid %}">{{ city.name }}</a></h2>
    <small>作成日: {{ city.created_at }}</small>
    <p>住所: {{ city.address }}</p>
    <p>セールスマン: {{ city.salesman.name }}</p>
    <p>備考: {{ city.description }}</p>
</div>
{% endblock %}
