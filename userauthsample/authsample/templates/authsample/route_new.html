{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block main %}
<div class="container my-5">
    <div class="card shadow-sm rounded">
        <div class="card-header bg-white border-bottom">
            <h4 class="mb-0">経路の登録</h4>
        </div>
        <div class="card-body">
            <p class="text-muted">
                <strong>注意:</strong> <strong>Depot</strong> は <strong>Cities</strong> に含める必要があります。
            </p>

            <form method="post">
                {% csrf_token %}
                {% bootstrap_form form layout='vertical' %}
                <div class="mt-4 d-flex justify-content-end">
                    {% bootstrap_button button_type="submit" content="登録" button_class="btn-outline-success" %}
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
