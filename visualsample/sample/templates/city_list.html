<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>City List</title>
</head>
<body>
    <h1>都市一覧</h1>
    <ul>
        {% for city in cities %}
            <li>{{ city.name }} (担当者: {{ city.salesman.name }})</li>
        {% endfor %}
    </ul>

    <h2>新規登録</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">登録</button>
    </form>
</body>
</html>
