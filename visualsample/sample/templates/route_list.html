<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Route List</title>
</head>
<body>
    <h1>ルート一覧</h1>
    <ul>
        {% for route in routes %}
            <li>{{ route.name }}
                <br>都市: 
                {% for city in route.cities.all %}
                    {{ city.name }},
                {% endfor %}
                <br>営業担当者: 
                {% for salesman in route.salesmen.all %}
                    {{ salesman.name }},
                {% endfor %}
            </li>
        {% endfor %}
    </ul>

    <h2>新規登録</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">登録</button>
    </form>
</body>
</html>
