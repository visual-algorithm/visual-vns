{% extends "base.html" %}

{% block main %}

<h2>経路作成の準備</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
</form>

{% if selected_cities %}
    <h2>選択済みの都市</h2>
    <ul>
        {% for city in selected_cities %}
            <li>{{ city.city_name }}</li>
        {% endfor %}
    </ul>
    <a class="btn btn-primary" href="{% url 'solve' %}">経路を作成する</a>
{% else %}
    <p>まだ都市が選択されていません。</p>
{% endif %}

{% endblock %}
