{% extends "base.html" %}

{% block main %}

<h2>経路作成の準備</h2>

{% if cities %}
<table class="table">
    <thead>
        <tr>
            <th>作成者</th>
            <th>作成日</th>
            <th>都市名</th>
            <th>選択</th>
        </tr>
    </thead>
    <tbody>
        {% for city in cities %}
        <tr>
            <th>{{ city.created_by.username }}</th>
            <th>{{ city.created_at }}</th>
            <th><a href="{% url 'city_detail' city.id %}">{{ city.city_name }}</a></th>
            <th><input type="radio"/></th>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>都市はまだ作成されていません。</p>
{% endif %}

{% endblock %}
