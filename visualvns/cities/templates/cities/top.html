<html>
    <head>
        <meta charset="utf-8">
        <title>ビジュアル VNS</title>
    </head>
    <body>
        <h1>ようこそ ビジュアル VNSへ!</h1>
        <h2>都市一覧</h2>
        {% if cities %}
        <table class="table">
            <thead>
                <tr>
                    <th>作成者</th>
                    <th>作成日</th>
                    <th>都市名</th>
                </tr>
            </thead>
            <tbody>
                {% for city in cities %}
                <tr>
                    <th>{{ city.created_by.username }}</th>
                    <th>{{ city.created_at }}</th>
                    <th><a href="{% url 'city_detail' city.id %}">{{ city.city_name }}</a></th>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p>都市はまだ作成されていません。</p>
        {% endif %}
    </body>
</html>
